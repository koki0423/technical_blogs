<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .Title }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Site.Params.description }}">
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <script defer src="{{ "js/theme.js" | relURL }}"></script>
  <script defer src="{{ "js/image-lightbox.js" | relURL }}"></script>
  <script defer src="{{ "js/post-filter.js" | relURL }}"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へ移動</a>
  <header class="site-header">
    <div class="container">
      <a class="site-title" href="{{ .Site.Home.RelPermalink }}" aria-label="{{ .Site.Title }} のホーム">
        <span class="site-mark" aria-hidden="true">K</span>
        <span>{{ .Site.Title }}</span>
      </a>
      <div class="header-controls">
        <nav aria-label="メインナビゲーション">
          <a href="{{ .Site.Home.RelPermalink }}"{{ if .IsHome }} aria-current="page"{{ end }}>Home</a>
          <a href="{{ with .Site.GetPage "section" "posts" }}{{ .RelPermalink }}{{ end }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Posts</a>
        </nav>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="ダークモードに切り替え" aria-pressed="false">
          <span class="theme-toggle-icon" aria-hidden="true">☾</span>
          <span class="theme-toggle-text">Dark</span>
        </button>
      </div>
    </div>
  </header>

  <main id="main-content" class="container site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="container site-footer">
    <p>&copy; {{ if gt now.Year 2026 }}2026–{{ end }}{{ now.Year }} K.S. All rights reserved.</p>
    <p><span class="footer-mark" aria-hidden="true"></span> Generated by GPT-5.6-terra · Built with Hugo · Published on GitHub Pages</p>
  </footer>
</body>
</html>
