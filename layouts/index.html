{{ define "main" }}
{{ .Content }}

<h2>Latest Posts</h2>
<ul class="post-list">
  {{ range first 10 (where .Site.RegularPages "Section" "posts").ByDate.Reverse }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <span>{{ .Date.Format "2006-01-02" }}</span>
    </li>
  {{ end }}
</ul>
{{ end }}
